# Single-RGD variant: one component, one graph. All configurability is
# declared in this schema; nothing is exchanged at the component level.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: thalamus
spec:
  schema:
    apiVersion: v1alpha1
    kind: Thalamus
    scope: Namespaced
    spec:
      nodeFeatureDiscovery: object
      gpuOperator: object
      kubePrometheusStack: object
      agentgateway: object
      externalDns: object
      openWebui: object
      thalamus: object
    status:
      ready: ${thalamusHelmRelease.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
  resources:
    # ==========================================================
    # Bootstrap (self managed) configuration
    # ==========================================================
    - id: thalamusNamespace
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: thalamus

    - id: repository
      readyWhen:
        - ${repository.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Repository
        metadata:
          name: ${schema.metadata.name}-repository
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          repositorySpec:
            baseUrl: "keppel.eu-de-1.cloud.sap/thalamus/ocm"
            type: OCIRegistry
          interval: 10m

    - id: component
      readyWhen:
        - ${component.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Component
        metadata:
          name: ${schema.metadata.name}-component
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          component: github.com/cobaltcore-dev/thalamus
          repositoryRef:
            name: ${repository.metadata.name}
          semver: ">=0.1.0"
          interval: 1m

    - id: rgdResource
      readyWhen:
        - ${rgdResource.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.metadata.name}-resource-rgd
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              resource:
                name: thalamus-rgd

    - id: rgdDeployer
      readyWhen:
        - ${rgdDeployer.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Deployer
        metadata:
          name: ${schema.metadata.name}-deployer
        spec:
          resourceRef:
            name: ${rgdResource.metadata.name}
            namespace: ${thalamusNamespace.metadata.name}

    # ==========================================================
    # Namespaces
    # ==========================================================
    - id: nfdNamespace
      includeWhen:
        - ${schema.spec.nodeFeatureDiscovery != null && has(schema.spec.nodeFeatureDiscovery.enabled) && schema.spec.nodeFeatureDiscovery.enabled}
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: node-feature-discovery

    - id: gpuOperatorNamespace
      includeWhen:
        - ${schema.spec.gpuOperator != null && has(schema.spec.gpuOperator.enabled) && schema.spec.gpuOperator.enabled}
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: gpu-operator

    - id: monitoringNamespace
      includeWhen:
        - ${schema.spec.kubePrometheusStack != null && has(schema.spec.kubePrometheusStack.enabled) && schema.spec.kubePrometheusStack.enabled}
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: monitoring

    - id: agentgatewayNamespace
      includeWhen:
        - ${schema.spec.agentgateway != null && has(schema.spec.agentgateway.enabled) && schema.spec.agentgateway.enabled}
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: agentgateway-system

    - id: externalDnsNamespace
      includeWhen:
        - ${schema.spec.externalDns != null && has(schema.spec.externalDns.enabled) && schema.spec.externalDns.enabled}
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: external-dns

    - id: openWebuiNamespace
      includeWhen:
        - ${schema.spec.openWebui != null && has(schema.spec.openWebui.enabled) && schema.spec.openWebui.enabled}
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: open-webui

    # ==========================================================
    # gateway-api-crds
    # ==========================================================
    - id: gatewayApiCrdsChartResource
      readyWhen:
        - ${gatewayApiCrdsChartResource.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.metadata.name}-resource-gateway-api-crds
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: gateway-api-crds
              resource:
                name: gateway-api-chart
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: gatewayApiCrdsOciRepository
      readyWhen:
        - ${gatewayApiCrdsOciRepository.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: ${schema.metadata.name}-oci-gateway-api-crds
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          interval: 1m0s
          layerSelector:
            mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
            operation: copy
          url: oci://${gatewayApiCrdsChartResource.status.additional.oci.registry}/${gatewayApiCrdsChartResource.status.additional.oci.repository}
          ref:
            digest: ${gatewayApiCrdsChartResource.status.additional.oci.digest}

    - id: gatewayApiCrdsHelmRelease
      readyWhen:
        - ${gatewayApiCrdsHelmRelease.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: gateway-api-crds
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          releaseName: gateway-api-crds
          targetNamespace: default
          interval: 1m
          timeout: 5m
          chartRef:
            kind: OCIRepository
            name: ${gatewayApiCrdsOciRepository.metadata.name}

    # ==========================================================
    # gateway-api-inference-extension-crds
    # ==========================================================
    - id: gatewayApiInfExtCrdsChartResource
      readyWhen:
        - ${gatewayApiInfExtCrdsChartResource.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.metadata.name}-resource-gateway-api-inference-extension-crds
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: gateway-api-inference-extension-crds
              resource:
                name: gateway-api-inference-extension-chart
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: gatewayApiInfExtCrdsOciRepository
      readyWhen:
        - ${gatewayApiInfExtCrdsOciRepository.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: ${schema.metadata.name}-oci-gateway-api-inference-extension-crds
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          interval: 1m0s
          layerSelector:
            mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
            operation: copy
          url: oci://${gatewayApiInfExtCrdsChartResource.status.additional.oci.registry}/${gatewayApiInfExtCrdsChartResource.status.additional.oci.repository}
          ref:
            digest: ${gatewayApiInfExtCrdsChartResource.status.additional.oci.digest}

    - id: gatewayApiInfExtCrdsHelmRelease
      readyWhen:
        - ${gatewayApiInfExtCrdsHelmRelease.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: gateway-api-inference-extension-crds
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          releaseName: gateway-api-inference-extension-crds
          targetNamespace: default
          interval: 1m
          timeout: 5m
          chartRef:
            kind: OCIRepository
            name: ${gatewayApiInfExtCrdsOciRepository.metadata.name}

    # ==========================================================
    # node-feature-discovery
    # ==========================================================
    - id: nfdChartResource
      includeWhen:
        - ${schema.spec.nodeFeatureDiscovery != null && has(schema.spec.nodeFeatureDiscovery.enabled) && schema.spec.nodeFeatureDiscovery.enabled}
      readyWhen:
        - ${nfdChartResource.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.metadata.name}-resource-node-feature-discovery
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: node-feature-discovery
              resource:
                name: node-feature-discovery-chart
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: nfdImage
      includeWhen:
        - ${schema.spec.nodeFeatureDiscovery != null && has(schema.spec.nodeFeatureDiscovery.enabled) && schema.spec.nodeFeatureDiscovery.enabled}
      readyWhen:
        - ${nfdImage.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.metadata.name}-image-node-feature-discovery
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: node-feature-discovery
              resource:
                name: node-feature-discovery-image
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: nfdOciRepository
      includeWhen:
        - ${schema.spec.nodeFeatureDiscovery != null && has(schema.spec.nodeFeatureDiscovery.enabled) && schema.spec.nodeFeatureDiscovery.enabled}
      readyWhen:
        - ${nfdOciRepository.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: ${schema.metadata.name}-oci-node-feature-discovery
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          interval: 1m0s
          layerSelector:
            mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
            operation: copy
          url: oci://${nfdChartResource.status.additional.oci.registry}/${nfdChartResource.status.additional.oci.repository}
          ref:
            digest: ${nfdChartResource.status.additional.oci.digest}

    - id: nfdHelmRelease
      includeWhen:
        - ${schema.spec.nodeFeatureDiscovery != null && has(schema.spec.nodeFeatureDiscovery.enabled) && schema.spec.nodeFeatureDiscovery.enabled}
      readyWhen:
        - ${nfdHelmRelease.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: node-feature-discovery
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          releaseName: node-feature-discovery
          targetNamespace: ${nfdNamespace.metadata.name}
          interval: 1m
          timeout: 5m
          chartRef:
            kind: OCIRepository
            name: ${nfdOciRepository.metadata.name}
          values: |-
            ${
              {
                "image": {
                  "repository": nfdImage.status.additional.oci.registry + "/" + nfdImage.status.additional.oci.repository,
                  "tag": "v0.19.0@" + nfdImage.status.additional.oci.digest,
                },
              }.merge(schema.spec.nodeFeatureDiscovery)
            }

    # ==========================================================
    # gpu-operator
    # ==========================================================
    - id: gpuOperatorChartResource
      includeWhen:
        - ${schema.spec.gpuOperator != null && has(schema.spec.gpuOperator.enabled) && schema.spec.gpuOperator.enabled}
      readyWhen:
        - ${gpuOperatorChartResource.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.metadata.name}-resource-gpu-operator
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: gpu-operator
              resource:
                name: gpu-operator-chart
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: gpuOperatorOciRepository
      includeWhen:
        - ${schema.spec.gpuOperator != null && has(schema.spec.gpuOperator.enabled) && schema.spec.gpuOperator.enabled}
      readyWhen:
        - ${gpuOperatorOciRepository.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: ${schema.metadata.name}-oci-gpu-operator
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          interval: 1m0s
          layerSelector:
            mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
            operation: copy
          url: oci://${gpuOperatorChartResource.status.additional.oci.registry}/${gpuOperatorChartResource.status.additional.oci.repository}
          ref:
            digest: ${gpuOperatorChartResource.status.additional.oci.digest}

    - id: gpuOperatorHelmRelease
      includeWhen:
        - ${schema.spec.gpuOperator != null && has(schema.spec.gpuOperator.enabled) && schema.spec.gpuOperator.enabled}
      readyWhen:
        - ${gpuOperatorHelmRelease.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: gpu-operator
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          releaseName: gpu-operator
          targetNamespace: ${gpuOperatorNamespace.metadata.name}
          interval: 1m
          timeout: 5m
          dependsOn:
            - name: ${nfdHelmRelease.metadata.name}
          chartRef:
            kind: OCIRepository
            name: ${gpuOperatorOciRepository.metadata.name}
          values: |-
            ${
              schema.spec.gpuOperator.merge({
                "nfd": {"enabled": false}.merge(has(schema.spec.gpuOperator.nfd) ? schema.spec.gpuOperator.nfd : {}),
              })
            }

    # ==========================================================
    # kube-prometheus-stack
    # ==========================================================
    - id: kpsChartResource
      includeWhen:
        - ${schema.spec.kubePrometheusStack != null && has(schema.spec.kubePrometheusStack.enabled) && schema.spec.kubePrometheusStack.enabled}
      readyWhen:
        - ${kpsChartResource.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.metadata.name}-resource-kube-prometheus-stack
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: kube-prometheus-stack
              resource:
                name: kube-prometheus-stack-chart
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: kpsPrometheusOperatorImage
      includeWhen:
        - ${schema.spec.kubePrometheusStack != null && has(schema.spec.kubePrometheusStack.enabled) && schema.spec.kubePrometheusStack.enabled}
      readyWhen:
        - ${kpsPrometheusOperatorImage.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.metadata.name}-image-prometheus-operator
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: kube-prometheus-stack
              resource:
                name: prometheus-operator-image
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: kpsConfigReloaderImage
      includeWhen:
        - ${schema.spec.kubePrometheusStack != null && has(schema.spec.kubePrometheusStack.enabled) && schema.spec.kubePrometheusStack.enabled}
      readyWhen:
        - ${kpsConfigReloaderImage.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.metadata.name}-image-config-reloader
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: kube-prometheus-stack
              resource:
                name: config-reloader-image
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: kpsThanosImage
      includeWhen:
        - ${schema.spec.kubePrometheusStack != null && has(schema.spec.kubePrometheusStack.enabled) && schema.spec.kubePrometheusStack.enabled}
      readyWhen:
        - ${kpsThanosImage.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.metadata.name}-image-thanos
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: kube-prometheus-stack
              resource:
                name: thanos-image
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: kpsPrometheusImage
      includeWhen:
        - ${schema.spec.kubePrometheusStack != null && has(schema.spec.kubePrometheusStack.enabled) && schema.spec.kubePrometheusStack.enabled}
      readyWhen:
        - ${kpsPrometheusImage.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.metadata.name}-image-prometheus
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: kube-prometheus-stack
              resource:
                name: prometheus-image
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: kpsAlertmanagerImage
      includeWhen:
        - ${schema.spec.kubePrometheusStack != null && has(schema.spec.kubePrometheusStack.enabled) && schema.spec.kubePrometheusStack.enabled}
      readyWhen:
        - ${kpsAlertmanagerImage.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.metadata.name}-image-alertmanager
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: kube-prometheus-stack
              resource:
                name: alertmanager-image
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: kpsWebhookCertgenImage
      includeWhen:
        - ${schema.spec.kubePrometheusStack != null && has(schema.spec.kubePrometheusStack.enabled) && schema.spec.kubePrometheusStack.enabled}
      readyWhen:
        - ${kpsWebhookCertgenImage.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.metadata.name}-image-webhook-certgen
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: kube-prometheus-stack
              resource:
                name: webhook-certgen-image
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: kpsKubeStateMetricsImage
      includeWhen:
        - ${schema.spec.kubePrometheusStack != null && has(schema.spec.kubePrometheusStack.enabled) && schema.spec.kubePrometheusStack.enabled}
      readyWhen:
        - ${kpsKubeStateMetricsImage.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.metadata.name}-image-kube-state-metrics
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: kube-prometheus-stack
              resource:
                name: kube-state-metrics-image
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: kpsOciRepository
      includeWhen:
        - ${schema.spec.kubePrometheusStack != null && has(schema.spec.kubePrometheusStack.enabled) && schema.spec.kubePrometheusStack.enabled}
      readyWhen:
        - ${kpsOciRepository.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: ${schema.metadata.name}-oci-kube-prometheus-stack
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          interval: 1m0s
          layerSelector:
            mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
            operation: copy
          url: oci://${kpsChartResource.status.additional.oci.registry}/${kpsChartResource.status.additional.oci.repository}
          ref:
            digest: ${kpsChartResource.status.additional.oci.digest}

    - id: kpsHelmRelease
      includeWhen:
        - ${schema.spec.kubePrometheusStack != null && has(schema.spec.kubePrometheusStack.enabled) && schema.spec.kubePrometheusStack.enabled}
      readyWhen:
        - ${kpsHelmRelease.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: kube-prometheus-stack
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          releaseName: kube-prometheus-stack
          targetNamespace: ${monitoringNamespace.metadata.name}
          interval: 1m
          timeout: 5m
          chartRef:
            kind: OCIRepository
            name: ${kpsOciRepository.metadata.name}
          values: |-
            ${
              {
                "nodeExporter": {"enabled": false},
                "grafana": {"enabled": false},
              }.merge(schema.spec.kubePrometheusStack).merge({
                "nodeExporter": {"enabled": false}.merge(has(schema.spec.kubePrometheusStack.nodeExporter) ? schema.spec.kubePrometheusStack.nodeExporter : {}),
                "grafana": {"enabled": false}.merge(has(schema.spec.kubePrometheusStack.grafana) ? schema.spec.kubePrometheusStack.grafana : {}),
                "prometheusOperator": (has(schema.spec.kubePrometheusStack.prometheusOperator) ? schema.spec.kubePrometheusStack.prometheusOperator : {}).merge({
                  "image": {
                    "registry": kpsPrometheusOperatorImage.status.additional.oci.registry,
                    "repository": kpsPrometheusOperatorImage.status.additional.oci.repository,
                    "tag": "v0.92.1@" + kpsPrometheusOperatorImage.status.additional.oci.digest,
                  }.merge(has(schema.spec.kubePrometheusStack.prometheusOperator) && has(schema.spec.kubePrometheusStack.prometheusOperator.image) ? schema.spec.kubePrometheusStack.prometheusOperator.image : {}),
                  "thanosImage": {
                    "registry": kpsThanosImage.status.additional.oci.registry,
                    "repository": kpsThanosImage.status.additional.oci.repository,
                    "tag": "v0.42.0@" + kpsThanosImage.status.additional.oci.digest,
                  }.merge(has(schema.spec.kubePrometheusStack.prometheusOperator) && has(schema.spec.kubePrometheusStack.prometheusOperator.thanosImage) ? schema.spec.kubePrometheusStack.prometheusOperator.thanosImage : {}),
                  "prometheusConfigReloader": (has(schema.spec.kubePrometheusStack.prometheusOperator) && has(schema.spec.kubePrometheusStack.prometheusOperator.prometheusConfigReloader) ? schema.spec.kubePrometheusStack.prometheusOperator.prometheusConfigReloader : {}).merge({
                    "image": {
                      "registry": kpsConfigReloaderImage.status.additional.oci.registry,
                      "repository": kpsConfigReloaderImage.status.additional.oci.repository,
                      "tag": "v0.92.1@" + kpsConfigReloaderImage.status.additional.oci.digest,
