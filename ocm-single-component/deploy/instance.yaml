# Sample per-cluster instance. Every supported knob is declared in the
# RGD schema; this is the entire configuration surface.
apiVersion: kro.run/v1alpha1
kind: Thalamus
metadata:
  name: thalamus
  namespace: thalamus
spec:
  nodeFeatureDiscovery:
    enabled: true
  gpuOperator:
    enabled: false
  kubePrometheusStack:
    enabled: false
  agentgateway:
    enabled: true
  externalDns:
    enabled: true
  openWebui:
    enabled: true
